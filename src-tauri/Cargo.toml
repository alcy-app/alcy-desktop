[package]
name = "alcy-desktop"
version = "0.9.0"
description = "Alcy desktop shell (Tauri adapter and composition root)"
edition = "2024"
publish = false
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "alcy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
alcy-agent = { path = "../crates/alcy-agent" }
alcy-app = { path = "../crates/alcy-app" }
alcy-collection-import = { path = "../crates/alcy-collection-import" }
alcy-domain = { path = "../crates/alcy-domain" }
alcy-git = { path = "../crates/alcy-git" }
alcy-gitlab = { path = "../crates/alcy-gitlab" }
alcy-graphql = { path = "../crates/alcy-graphql" }
alcy-grpc = { path = "../crates/alcy-grpc" }
alcy-http-proxy = { path = "../crates/alcy-http-proxy" }
alcy-onedrive = { path = "../crates/alcy-onedrive" }
alcy-openapi = { path = "../crates/alcy-openapi" }
alcy-platform = { path = "../crates/alcy-platform" }
alcy-rest = { path = "../crates/alcy-rest" }
alcy-script-packages = { path = "../crates/alcy-script-packages" }
alcy-scripting = { path = "../crates/alcy-scripting" }
alcy-storage = { path = "../crates/alcy-storage" }
alcy-webclient = { path = "../crates/alcy-webclient" }
alcy-websocket = { path = "../crates/alcy-websocket" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Published updates use signed EXE/MSI installers and raw AppImages.
# Disable legacy archive extraction to remove the vulnerable zip dependency.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "sync", "fs"] }
url = "2"
percent-encoding = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"

[lints]
workspace = true
