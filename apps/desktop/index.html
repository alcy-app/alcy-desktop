<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alcy</title>
    <script>
      // Aplica o tema salvo antes do React montar, evitando flash do tema padrão.
      try {
        var t = window.localStorage.getItem('alcy:theme')
        t = t === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
