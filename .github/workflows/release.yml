name: release

# Pushing a `release/vX.Y.Z` branch builds the signed installers for that
# version (Windows NSIS/MSI, Linux AppImage) and publishes them, with the
# updater manifest `latest.json`, as the GitHub release `vX.Y.Z`.
on:
  push:
    branches: ["release/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Update source embedded in the binary (scripts/build-env.mjs).
  ALCY_UPDATE_PROVIDER: github
  ALCY_UPDATE_URL: ${{ github.repository }}

jobs:
  prepare:
    # Only the main repository publishes releases.
    if: github.repository == 'alcy-app/alcy-desktop'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Check security invariants
        run: node scripts/check-security-invariants.mjs

      # Branch version = app version, dated CHANGELOG section, tag not taken.
      - name: Validate release branch
        id: prepare
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME" --notes-file release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    # Holds the signing key; required reviewers on this environment gate the build.
    environment: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            artifact: bundle-windows
            paths: |
              target/release/bundle/nsis/*-setup.exe*
              target/release/bundle/msi/*.msi*
          # Oldest supported glibc, so the AppImage runs on more distributions.
          - os: ubuntu-22.04
            artifact: bundle-linux
            paths: |
              target/release/bundle/appimage/*.AppImage*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            file

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # No dependency caches: release builds start clean.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      # Installs the version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Build signed installers
        run: pnpm release:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  # A single job publishes, so both platforms land in one `latest.json`
  # without racing for it.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      # Rebuild the bundle layout publish-release.mjs expects (nsis/, msi/, appimage/).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-windows
          path: bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-linux
          path: bundle/appimage

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Publish release v${{ needs.prepare.outputs.version }}
        run: node scripts/publish-release.mjs --bundle-dir bundle --notes-file release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.sha }}
