[package]
name = "alcy-load"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-domain = { path = "../alcy-domain" }
alcy-scripting = { path = "../alcy-scripting" }
futures-util = "0.3"
regex = "1"
scraper = "0.27"
sxd-document = "0.3"
