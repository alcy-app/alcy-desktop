[package]
name = "alcy-http-auth"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-domain = { path = "../alcy-domain" }
cookie = "0.18"
digest_auth = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
wiremock = "0.6"

[lints]
workspace = true
