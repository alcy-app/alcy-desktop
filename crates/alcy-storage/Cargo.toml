[package]
name = "alcy-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-app = { path = "../alcy-app" }
alcy-domain = { path = "../alcy-domain" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
printpdf = { version = "0.12.8", default-features = false, features = ["png", "jpeg"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[lints]
workspace = true
