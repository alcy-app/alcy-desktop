[package]
name = "alcy-rest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-app = { path = "../alcy-app" }
alcy-domain = { path = "../alcy-domain" }
alcy-http-auth = { path = "../alcy-http-auth" }
alcy-http-proxy = { path = "../alcy-http-proxy" }
base64 = "0.22"
cookie = "0.18"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy", "multipart", "stream", "gzip", "deflate", "brotli"] }
tokio = { version = "1", features = ["fs"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
