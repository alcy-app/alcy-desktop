[package]
name = "alcy-script-packages"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-scripting = { path = "../alcy-scripting" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
