[package]
name = "alcy-grpc"
version = "0.1.0"
edition = "2024"
publish = false

# gRPC capability (spec 0129, ADR 0062). tonic over hyper/h2 with rustls on
# the ring provider (both already in the lockfile, no aws-lc-rs); dynamic
# messages from runtime descriptors (prost-reflect), `.proto` files compiled
# in-process (protox, no `protoc`) and the reflection client protos.
[dependencies]
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }
tonic-reflection = { version = "0.14", default-features = false }
tower = { version = "0.5", features = ["util"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router"] }
tonic-reflection = { version = "0.14", features = ["server"] }

[lints]
workspace = true
