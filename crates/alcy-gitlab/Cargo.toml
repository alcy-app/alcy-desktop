[package]
name = "alcy-gitlab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
alcy-app = { path = "../alcy-app" }
alcy-domain = { path = "../alcy-domain" }
alcy-http-proxy = { path = "../alcy-http-proxy" }
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
